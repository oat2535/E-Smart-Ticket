<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>พิมพ์ QR Code / Barcode</title>
    <!-- Use basic styles to reset padding/margins for printing -->
    <style>
        body {
            font-family: 'Sarabun', Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .print-controls {
            text-align: center;
            margin-bottom: 20px;
        }
        .btn-print {
            background-color: #4e73df;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-print:hover {
            background-color: #2e59d9;
        }
        .sticker-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .sticker {
            background: white;
            border: 1px dashed #ccc;
            padding: 15px;
            width: 320px; /* Adjust size based on physical sticker dimensions */
            display: flex;
            flex-direction: column;
            align-items: center;
            page-break-inside: avoid;
        }
        .sticker-codes {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
        }
        .qr-code-wrapper {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .barcode-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .barcode-wrapper svg {
            max-width: 100%;
            height: 60px;
        }
        .sticker-text {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            word-wrap: break-word;
            max-width: 100%;
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .print-controls {
                display: none;
            }
            /* Keep the dashed border visible during print */
            .sticker {
                border: 1px dashed #ccc !important;
                /* If browsers omit borders to save ink, using outline or ensuring border prints helps */
            }
        }
    </style>
    <!-- Load JsBarcode and qrcode.js -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="print-controls">
        <button class="btn-print" onclick="window.print()">
            🖨️ สั่งพิมพ์ (Print)
        </button>
    </div>

    <div class="sticker-container">
        {% for asset in assets %}
        <div class="sticker">
            <div class="sticker-codes">
                <div class="barcode-wrapper">
                    <!-- 1D Barcode (For Handheld) -->
                    <svg class="barcode-svg" data-value="{{ asset.asset_code }}"></svg>
                </div>
                <div class="qr-code-wrapper">
                    <!-- 2D QR Code (For Mobile Web Link) -->
                    <div class="qrcode-div" data-url="{{ asset.scan_url }}"></div>
                </div>
            </div>
            <div class="sticker-text">
                <div>{{ asset.asset_code }}</div>
                <div>{{ asset.name|truncatechars:50 }}</div>
            </div>
        </div>
        {% endfor %}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Generate Barcodes
            const barcodes = document.querySelectorAll('.barcode-svg');
            barcodes.forEach(function(svg) {
                const val = svg.getAttribute('data-value');
                JsBarcode(svg, val, {
                    format: "CODE128",
                    width: 1.5,
                    height: 50,
                    displayValue: false,
                    margin: 0
                });
            });

            // Generate QR Codes
            const qrcodes = document.querySelectorAll('.qrcode-div');
            qrcodes.forEach(function(div) {
                const url = div.getAttribute('data-url');
                new QRCode(div, {
                    text: url,
                    width: 80,
                    height: 80,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.L
                });
            });
        });
    </script>
</body>
</html>
