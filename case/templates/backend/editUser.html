{% extends "backend/layout.html" %}

{% block header %}
        <!-- CKEditor -->
        <script src="//cdn.ckeditor.com/4.16.1/standard/ckeditor.js"></script>
{% endblock %}

{% block content %}
<div class="card shadow mb-4">
    <!-- Basic Form Elements Title -->
    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
        <h6 class="m-0 font-weight-bold text-primary">Edit member</h6>
        <a href="{% url 'editPassword' userEdit.id %}" class="btn btn-primary btn-sm" 
            data-toggle="tooltip" title="Change password">
         <i class="fa fa-key" aria-hidden="true"></i>
        </a>
    </div>
    <!-- END Form Elements Title -->
    <!-- Basic Form Elements Content -->
    <div class="card-body">
         {% for message in messages %}
            <p class="text-danger">{{message}}</p>
         {% endfor %}
        <form action="{% url 'updateUser' userEdit.id%}" method="POST" id="form-register">
            {% csrf_token %}
            <h6 class="font-weight-bold text-primary mt-3 mb-3 border-bottom pb-2">1. Personal Information</h6>
            <div class="form-row">
                <div class="form-group col-md-4">    
                    <label class="font-weight-bold">Username</label>         
                    <input type="text" id="name" name="username" class="form-control" placeholder="" value="{{userEdit.username}}" disabled>
                    <input type="hidden" name="username" value="{{ userEdit.username }}">
                </div>
                <div class="form-group col-md-4">
                    <label class="font-weight-bold">First name</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" placeholder="First name" value="{{ userEdit.first_name }}">
                </div>
                <div class="form-group col-md-4">
                    <label class="font-weight-bold">Last name</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Last name" value="{{ userEdit.last_name }}">
                </div>   
            </div>

            <h6 class="font-weight-bold text-primary mt-3 mb-3 border-bottom pb-2">2. Work Information</h6>
            <div class="form-row">
                <div class="form-group col-md-3">  
                    <label class="font-weight-bold">Company</label>           
                    <select name="branch" id="branch-select" class="form-control">
                        <option value="{{userEdit.branch_id|default_if_none:''}}">--- {{userEdit.branch|default_if_none:"Please select company"}} ---</option>
                        {% for branch in branches %}
                            <option value="{{branch.branch_id}}">{{branch.branch_name}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group col-md-3">  
                    <label class="font-weight-bold">Branch</label>           
                    <select name="sub_branch" id="sub-branch-select" class="form-control">
                        <option value="{{userEdit.sub_branch_id|default_if_none:''}}">--- {{userEdit.sub_branch|default_if_none:"Please select branch"}} ---</option>
                        {% for sub_branch in sub_branches %}
                            <option value="{{sub_branch.sub_branch_id}}">{{sub_branch.sub_branch_name|default_if_none:""}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group col-md-3">
                    <label class="font-weight-bold">Department</label>
                    <select name="department" class="form-control">
                        <option value="">-- Please select department --</option>
                        {% for dept in departments %}
                            <option value="{{ dept.department_id }}" {% if userEdit.department_id == dept.department_id %}selected{% endif %}>{{ dept.department_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group col-md-3">
                    <label class="font-weight-bold">Position</label>
                    <select name="position" class="form-control">
                        <option value="">-- Please select position --</option>
                        {% for pos in positions %}
                            <option value="{{ pos.id }}" {% if userEdit.position_id == pos.id %}selected{% endif %}>{{ pos.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <h6 class="font-weight-bold text-primary mt-3 mb-3 border-bottom pb-2">3. Contact & Status</h6>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label class="font-weight-bold">Tele number</label>
                    <input type="text" id="phone_number" name="phone_number" class="form-control" placeholder="Tele number" value="{{userEdit.phone_number}}">
                </div>  

                <div class="form-group col-md-3 d-flex align-items-center">
                    <div class="form-check mt-4">
                        {{ form.is_staff }}
                        <label class="form-check-label font-weight-bold" for="id_is_staff">
                            Staff Status
                        </label>
                    </div>
                </div>

                <div class="form-group col-md-3 d-flex align-items-center">
                    <div class="form-check mt-4">
                        {{ form.is_active }}
                        <label class="form-check-label font-weight-bold" for="id_is_active">
                            Active Status
                        </label>
                    </div>
                </div>
            </div>

            <!-- เปลี่ยน Branch ตาม Company ที่เลือก -->
            <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
            <script>
                $(document).ready(function () {
                    // Event เมื่อเลือก Company
                    $('#branch-select').on('change', function () {
                        var branchId = $(this).val();  // ดึงค่า company ที่เลือก

                        $.ajax({
                            url: "/usermanage/addUser/ajax/load-subbranches/", // Django URL name
                            data: {
                                'branch_id': branchId
                            },
                            dataType: 'json',
                            success: function (data) {
                                var $subBranch = $('#sub-branch-select');
                                $subBranch.empty(); // ล้าง options เดิม

                                $subBranch.append('<option value="">-- Please select branch --</option>');

                                if (data.length > 0) {
                                    for (var i = 0; i < data.length; i++) {
                                        var option = $('<option></option>')
                                            .attr("value", data[i].sub_branch_id)
                                            .text(data[i].sub_branch_name);
                                        $subBranch.append(option);
                                    }
                                } else {
                                    $subBranch.append('<option value="">-- No branch available --</option>');
                                }
                            }
                        });
                    });
                });
            </script>

            <div class="form-group">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{% url 'displayUser' %}" class="btn btn-danger ml-1">
                    Back
                </a>
            </div>
        </form>
    </div>
    <!-- END Basic Form Elements Content -->
</div>
{% endblock%}
