{% extends "backend/layout.html" %}
{% load static %}

{% block header %}
{% endblock %}

{% block content %}
<div class="block">
    <!-- Basic Form Elements Title -->
    <div class="block-title">
        <h2><strong>Purchasing request detail</strong></h2>
    </div>

    <!-- END Form Elements Title -->
    <!-- Basic Form Elements Content -->
    {% for message in messages %}
    <p style="color: red;">{{message}}</p>
    {% endfor %}
    <form action="{% url 'insertData' %}" method="post" id = "caseForm" 
        enctype="multipart/form-data" class="form-horizontal form-bordered">
        {% csrf_token %}
        <div class="form-group">
            <input type="hidden" name="department" value="PUR">      
            <input type="hidden" name="source" value="blogFormPUR">

          <div class="col-md-4">
                <label for="category" style="display: block; margin-bottom: 5px; font-weight: bold;">
                    Type <label style="color: red;">*</label>
                </label>
                <select id="category" name="category" class="select-chosen" style="width: 250px;">
                    <option value="">-- Please select type --</option>
                    {% for category in categories_pur %}
                    <option value="{{ category.id }}" {% if category.id|stringformat:"s" == selected_category %}selected{% endif %}>
                        {{ category.name }}
                    </option>                    
                    {% endfor %}
                </select>
            </div>
            
            <div class="col-md-4">
                <label for="content"
                    style="display: block; margin-bottom: 5px; font-weight: bold;">
                    Priority <label for="content"
                        style="color: red;">*</label>
                </label>
                <select id="priority" name="priority" class="select-chosen" style="width: 250px;">
                    <option value="">-- Please select priority --</option>
                    {% for priorities in priorities %}
                        <option value="{{ priorities.id }}" {% if priorities.id|stringformat:"s" == selected_priority %}selected{% endif %}>
                            {{ priorities.priority_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <script>
            document.getElementById("caseForm").addEventListener("submit", function(e) {
                let category = document.getElementById("category").value;
                let priority = document.getElementById("priority").value;

                if (!category) {
                    e.preventDefault();
                    Swal.fire({
                        icon: 'warning',
                        title: 'กรุณาเลือก Type',
                        text: 'คุณต้องเลือกประเภทก่อนจึงจะส่งได้',
                        confirmButtonText: 'ตกลง'
                    });
                    return;
                }

                if (!priority) {
                    e.preventDefault();
                    Swal.fire({
                        icon: 'warning',
                        title: 'กรุณาเลือก Priority',
                        text: 'คุณต้องเลือกระดับความสำคัญก่อนจึงจะส่งได้',
                        confirmButtonText: 'ตกลง'
                    });
                    return;
                }
            });
        </script>

            <div class="form-group">
                <div class="col-md-4">
                    <label for="content"
                        style="display: block; margin-bottom: 5px; font-weight: bold;">
                        Name <label for="content"
                            style="color: red;">*</label>
                    </label>
                    <input type="text" id="name" name="name"
                        class="form-control" value="{{name}}" maxlength="30"
                        placeholder="Please enter your name" required>
                </div>
                <div class="col-md-4">
                    <label for="content"
                        style="display: block; margin-bottom: 5px; font-weight: bold;">
                        Tel number <label for="content"
                            style="color: red;">*</label>
                    </label>
                    <input type="text" id="name" name="mobile"
                        class="form-control" value="{{mobile}}" maxlength="50" oninput="this.value = this.value.replace(/[^0-9,]/g, '')"
                        placeholder="Please enter your telephone number, Ex. 085222xxxx,082666xxxx" required>
                </div>
                <div class="col-md-4">
                    <label for="content"
                        style="display: block; margin-bottom: 10px; font-weight: bold;">
                        E-mail 
                    </label>
                    <input type="email" id="name" name="email" class="form-control" value="{{email}}" placeholder="Please enter your E-mail, Ex. thonglor@hospital.com"> 
                </div>             
            </div>

        <div class="form-group">
            <!-- <div class="col-md-4">
                <label for="content"
                    style="display: block; margin-bottom: 5px; font-weight: bold;">
                    ชื่อเล่น
                </label>
                <input type="text" id="name" name="nickname"
                    class="form-control" value="{{nickname}}"
                    placeholder="กรุณากรอก ชื่อเล่น">
            </div> -->
            <div class="col-md-4">
                <label for="content"
                    style="display: block; margin-bottom: 5px; font-weight: bold;">
                    Computer Name
                    <!-- ปุ่มช่วยเหลือ -->
                    <i class="bi bi-book fa fa-align-center" data-toggle="modal" data-target="#helpModal" style="margin-left: 5px;" title="How to find your computer name"></i>
                </label>
                <input type="text" id="name" name="computer_name"
                    class="form-control" value="{{computer_name}}" maxlength="50"
                    placeholder="Please enter your computer name">
            </div>
            <div class="col-md-4">
                <label for="content"
                    style="display: block; margin-bottom: 5px; font-weight: bold;">
                    IP address
                </label>
                <input type="text" id="name" name="ip_address"
                    class="form-control" value="{{ip_address}}" maxlength="50" oninput="this.value = this.value.replace(/[^0-9.]/g, '')"
                    placeholder="Please enter your IP address, Ex. 192.168.25.xx">
            </div>
        </div>
            <!-- Modal -->
            <div class="modal fade" id="helpModal" tabindex="-1" aria-labelledby="helpModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                    <h5 class="modal-title" id="helpModalLabel">How to Find Computer Name</h5>
                    </div>
                    <div class="modal-body">
                    <!-- แสดง PDF -->
                    <iframe src="{% static 'backend/findcomputername.pdf' %}" width="100%" height="500px" style="border: none;"></iframe>
                    </div>
                </div>
                </div>
            </div>

        <div class="form-group">
            <div class="col-md-12">
                <label for="case_detail"
                    style="display: block; margin-bottom: 5px; font-weight: bold;">
                    Subject <label for="content"
                        style="color: red;">*</label>
                </label>
                <input type="text" name="subject_detail" class="form-control" value="{{subject_detail}}" maxlength="240" required>
            </div>
            <div class="col-md-12">
                <label for="case_detail"
                    style="display: block; margin-bottom: 5px; font-weight: bold; margin-top: 10px;">
                    Description <label for="content"
                        style="color: red;">*</label>
                </label>
                <textarea type="text" name="case_detail" rows="5"
                    class="form-control" required>{{case_detail}}</textarea>
            </div>
        </div>

        <div class="form-group">
            <div class="col-md-12">
                <label for="content"
                    style="display: block; margin-bottom: 5px; font-weight: bold;" >
                    Attach File 
                    <!-- <label for="content" style="color: red;">*</label> -->
                </label>
                <input type="file" name="image" class="form-control" id = "uploadFile"
                    placeholder="แนบภาพปัญหาที่พบ" accept="image/*,application/pdf,.xls,.xlsx,.csv"><br>
                    <label style="color: red; display: block; font-weight: normal;" >** You can only attach files with the extension .jpg, .jpeg, .png, .pdf, .xls, .xlsx, .csv, Limit file size 10MB only !</label>
            </div>
        </div>

        
        <script>
            const allowedTypes = [
                "image/jpeg", "image/png", "application/pdf",
                "application/vnd.ms-excel",
                "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                "text/csv", "application/csv"
            ];
            const maxFileSize = 10 * 1024 * 1024; // 10MB

            document.getElementById("uploadFile").addEventListener("change", function () {
                const file = this.files[0];
                if (!file) return;

                // ตรวจสอบประเภทไฟล์
                if (!allowedTypes.includes(file.type)) {
                    Swal.fire({
                        icon: "error",
                        title: "ไฟล์ไม่ถูกต้อง",
                        text: "อนุญาตเฉพาะไฟล์ .jpg, .jpeg, .png, .pdf, .xls, .xlsx, .csv เท่านั้น!",
                    });
                    this.value = ""; // reset input
                    return;
                }

                // ตรวจสอบขนาดไฟล์
                if (file.size > maxFileSize) {
                    Swal.fire({
                        icon: "error",
                        title: "ไฟล์ใหญ่เกินไป",
                        text: "ไฟล์ต้องมีขนาดไม่เกิน 10MB เท่านั้น!",
                    });
                    this.value = ""; // reset input
                }
            });
        </script>

        <div class="form-group">
            <div class="col-md-12">
                <button type="submit" class="btn btn-sm btn-primary">Save</button>
                <a href="{% url 'case' %}?department_id=PUR" {% if "displayForm?department_id=PUR" in request.path %}{%endif%}>  
                    <button type="button" class="btn btn-sm btn-danger"
                        style="margin-left: 1px;">
                        Back
                    </button>
                </a>
            </div>
        </div>
        <script>
            document.getElementById("caseForm").addEventListener("submit", function(e) {
                e.preventDefault(); // ป้องกัน form submit ปกติ
                let form = this;
                let formData = new FormData(form);

                // Validate แบบเดิม
                let category = document.getElementById("category").value;
                let priority = document.getElementById("priority").value;
                if (!category || !priority) {
                    Swal.fire({
                        icon: 'warning',
                        title: !category ? 'กรุณาเลือก Type' : 'กรุณาเลือก Priority',
                        text: !category ? 'คุณต้องเลือกประเภทก่อนจึงจะส่งได้' : 'คุณต้องเลือกระดับความสำคัญก่อนจึงจะส่งได้',
                        confirmButtonText: 'ตกลง'
                    });
                    return;
                }

                fetch("{% url 'insertData' %}", {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": "{{ csrf_token }}"
                    },
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        Swal.fire({
                            icon: "success",
                            title: "Success",
                            text: data.message,
                            confirmButtonText: "ตกลง"
                        }).then(() => {
                            window.location.href = data.redirect_url;
                        });
                    } else {
                        Swal.fire({
                            icon: "error",
                            title: "Error",
                            text: data.message
                        });
                    }
                })
                .catch(error => {
                    Swal.fire({
                        icon: "error",
                        title: "Error",
                        text: "เกิดข้อผิดพลาด"
                    });
                });
            });
        </script>
    </form>

    <!-- END Basic Form Elements Content -->
</div>
{% endblock%}
